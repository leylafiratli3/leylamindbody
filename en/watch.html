    <script src="../script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../store.js"></script>
    <script>
    (async () => {
        const box = document.getElementById('watch-box');
        const slug = Store.getParam('p');
        const notFound = '<p class="text-clay-600 font-light mb-6">This class could not be found.</p><a href="classes.html" class="btn-ghost font-display">Back to all classes</a>';
        if (!slug) { box.innerHTML = notFound; return; }

        let title = '';
        try {
            const { product } = await Store.api.product(slug);
            title = product.title;
        } catch (err) { box.innerHTML = notFound; return; }

        const titleHtml = `
            <h1 class="text-3xl lg:text-4xl font-display font-light text-clay-800 mb-4 tracking-tight">${title}</h1>
            <div class="w-16 h-[2px] mb-8" style="background: linear-gradient(90deg, #844b4b, #d4a0a0);"></div>`;

        const session = await Store.getSession();
        if (!session) {
            box.innerHTML = titleHtml + `
                <p class="text-lg text-clay-600 font-light mb-8">Please log in to watch this video.</p>
                <a href="login.html?next=${encodeURIComponent('watch.html?p=' + slug)}" class="btn-primary font-display">Log in</a>`;
            return;
        }
        try {
            const { url } = await Store.api.videoToken(slug);
            box.innerHTML = titleHtml + `
                <div class="relative w-full rounded-2xl overflow-hidden shadow-lg border border-clay-100 bg-black" style="padding-top: 56.25%;">
                    <iframe src="${url}" class="absolute inset-0 w-full h-full" frameborder="0"
                        allow="accelerometer; gyroscope; autoplay; encrypted-media; picture-in-picture"
                        allowfullscreen loading="lazy"></iframe>
                </div>
                <p class="mt-8"><a href="library.html" class="btn-ghost font-display">My Library</a></p>`;
        } catch (err) {
            if (err.code === 'not_owned' || err.status === 403) {
                box.innerHTML = titleHtml + `
                    <p class="text-lg text-clay-600 font-light mb-8">You don't own this video yet.</p>
                    <a href="product.html?p=${encodeURIComponent(slug)}" class="btn-primary font-display">View this class</a>`;
            } else if (err.status === 401 || err.code === 'not_logged_in') {
                box.innerHTML = titleHtml + `
                    <p class="text-lg text-clay-600 font-light mb-8">Please log in to watch this video.</p>
                    <a href="login.html?next=${encodeURIComponent('watch.html?p=' + slug)}" class="btn-primary font-display">Log in</a>`;
            } else {
                box.innerHTML = titleHtml + '<p class="text-clay-600 font-light">Something went wrong. Please try again.</p>';
            }
        }
    })();
    </script>
