<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin | Leyla Fıratlı</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&family=Fraunces:ital,opsz,wght,SOFT@0,9..144,400..600,0..100;1,9..144,400..600,0..100&display=swap">
  <link rel="stylesheet" href="liberation.css">
  <style>
    body { background: var(--ecru); }
    .admin { max-width: 1100px; margin: 0 auto; padding: clamp(24px, 5vw, 56px) 16px 80px; }
    .admin-top { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 1rem; margin-bottom: 1.5rem; }
    .admin-top h1 { font-size: clamp(2rem, 4vw, 2.8rem); margin: 0; }
    .admin-login { max-width: 420px; margin-top: 2rem; }
    .admin-login .field { margin-bottom: 1.25rem; }
    .tabs { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1.25rem; }
    .tab { font-family: var(--font-body); font-weight: 500; font-size: 15px; color: var(--indigo); background: transparent; border: 1.5px solid var(--indigo); border-radius: 999px; padding: 10px 18px; cursor: pointer; }
    .tab[aria-selected="true"] { background: var(--indigo); color: var(--ecru); }
    .tab .count { opacity: 0.75; margin-left: 0.35rem; }
    .tab:focus-visible, .admin button:focus-visible, .admin select:focus-visible { outline: 2px solid var(--indigo); outline-offset: 3px; }
    .toolbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 0.75rem 1rem; margin-bottom: 1.25rem; }
    .toolbar select { font: inherit; color: var(--indigo); background: var(--ecru-deep); border: 0; border-radius: 999px; padding: 8px 14px; }
    .btn-small { font-size: 14px; padding: 9px 18px; }
    .ad-entry { background: var(--ecru-deep); border-radius: 24px; padding: 24px 28px; margin-bottom: 1rem; }
    .ad-entry.ad-flag { background: var(--rose-wash); }
    .ad-entry-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 0.25rem 1rem; margin-bottom: 0.75rem; }
    .ad-entry-name { font-family: var(--font-head); font-weight: 600; font-size: 1.3rem; margin: 0; }
    .ad-entry-date { font-size: 0.9rem; opacity: 0.8; }
    .ad-entry dl { display: grid; grid-template-columns: max-content 1fr; gap: 0.35rem 1.25rem; margin: 0; }
    .ad-entry dt { font-size: 12px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; padding-top: 0.2rem; }
    .ad-entry dd { margin: 0; overflow-wrap: anywhere; }
    .ad-entry a { color: var(--indigo); }
    .pill { display: inline-block; font-size: 12px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; border: 1.5px solid var(--indigo); border-radius: 999px; padding: 0.2em 0.7em; margin-right: 0.4rem; }
    .pill.solid { background: var(--indigo); color: var(--ecru); }
    .note-body { white-space: pre-wrap; margin: 0.75rem 0 0; }
    table { width: 100%; border-collapse: collapse; background: var(--ecru-deep); border-radius: 16px; overflow: hidden; }
    th, td { text-align: left; padding: 12px 16px; border-bottom: 1px solid rgba(35, 40, 94, 0.12); }
    th { font-size: 12px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; }
    .table-wrap { overflow-x: auto; }
    .empty { padding: 2rem 0; }
    .admin-msg { font-weight: 500; min-height: 1.5em; }
    .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    @media (max-width: 560px) { .ad-entry dl { grid-template-columns: 1fr; } .ad-entry dt { padding-top: 0.5rem; } }
  </style>
</head>
<body>
  <main class="admin">
    <div class="admin-top">
      <h1>Admin</h1>
      <button type="button" class="btn btn-outline btn-small" id="logout" hidden>Log out</button>
    </div>

    <form class="admin-login" id="login">
      <div class="field">
        <label for="pw">Admin password</label>
        <input type="password" id="pw" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-primary">Log me in</button>
      <p class="admin-msg" id="login-msg" role="status" aria-live="polite"></p>
    </form>

    <div id="dash" hidden>
      <div class="tabs" role="tablist" aria-label="Forms">
        <button type="button" class="tab" role="tab" data-tab="signups" aria-selected="true">Program sign-ups<span class="count" id="count-signups"></span></button>
        <button type="button" class="tab" role="tab" data-tab="contact" aria-selected="false">Contact notes<span class="count" id="count-contact"></span></button>
        <button type="button" class="tab" role="tab" data-tab="freeclass" aria-selected="false">Free class<span class="count" id="count-freeclass"></span></button>
      </div>
      <div class="toolbar">
        <div id="filter-wrap">
          <label for="filter" class="visually-hidden">Show</label>
          <select id="filter">
            <option value="all">All sign-ups</option>
            <option value="november">November groups</option>
            <option value="waitlist">January waitlist</option>
            <option value="talk">Talk first (health item ticked)</option>
          </select>
        </div>
        <div style="display:flex;gap:0.5rem;flex-wrap:wrap">
          <button type="button" class="btn btn-outline btn-small" id="refresh">Refresh</button>
          <button type="button" class="btn btn-primary btn-small" id="csv">Download CSV</button>
        </div>
      </div>
      <p class="admin-msg" id="dash-msg" role="status" aria-live="polite"></p>
      <div id="list"></div>
    </div>
  </main>

  <script>
    (function () {
      var API = /^(localhost|127\.0\.0\.1)$/.test(location.hostname) ? 'http://localhost:3000' : 'https://leyla-mindbody-api.fly.dev';
      var KEY = 'leyla-admin';
      var pw = null;
      try { pw = sessionStorage.getItem(KEY); } catch (e) {}
      var data = { signups: [], contact: [], freeclass: [] };
      var tab = 'signups';
      var $ = function (id) { return document.getElementById(id); };

      function esc(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; });
      }
      function when(s) {
        if (!s) return '';
        var d = new Date(String(s).replace(' ', 'T') + 'Z');
        return isNaN(d) ? s : d.toLocaleString(undefined, { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
      }
      function get(path) {
        return fetch(API + path, { headers: { Authorization: 'Bearer ' + pw } }).then(function (r) {
          if (r.status === 401) throw new Error('auth');
          if (!r.ok) throw new Error('http');
          return r.json();
        });
      }
      function talkFirst(r) { return r.health && r.health !== 'None of these'; }

      function load() {
        $('dash-msg').textContent = 'Loading…';
        return Promise.all([get('/api/program-signups'), get('/api/contact-messages'), get('/api/registrations')]).then(function (res) {
          data.signups = res[0].signups || [];
          data.contact = res[1].messages || [];
          data.freeclass = (res[2].registrations || []).slice().reverse();
          $('login').hidden = true; $('dash').hidden = false; $('logout').hidden = false;
          $('dash-msg').textContent = '';
          try { sessionStorage.setItem(KEY, pw); } catch (e) {}
          render();
        });
      }

      function filtered() {
        if (tab !== 'signups') return data[tab];
        var f = $('filter').value;
        return data.signups.filter(function (r) {
          if (f === 'november') return !r.waitlist;
          if (f === 'waitlist') return !!r.waitlist;
          if (f === 'talk') return talkFirst(r);
          return true;
        });
      }

      function row(label, value) { return value ? '<dt>' + label + '</dt><dd>' + value + '</dd>' : ''; }

      function render() {
        $('count-signups').textContent = '(' + data.signups.length + ')';
        $('count-contact').textContent = '(' + data.contact.length + ')';
        $('count-freeclass').textContent = '(' + data.freeclass.length + ')';
        document.querySelectorAll('.tab').forEach(function (t) { t.setAttribute('aria-selected', t.dataset.tab === tab ? 'true' : 'false'); });
        $('filter-wrap').style.visibility = tab === 'signups' ? 'visible' : 'hidden';
        var rows = filtered();
        var html = '';
        if (!rows.length) html = '<p class="empty">Nothing here yet.</p>';
        else if (tab === 'signups') {
          html = rows.map(function (r) {
            var pills = (r.waitlist ? '<span class="pill">Waitlist</span>' : '') + (talkFirst(r) ? '<span class="pill solid">Talk first</span>' : '');
            return '<article class="ad-entry' + (talkFirst(r) ? ' ad-flag' : '') + '"><div class="ad-entry-head"><p class="ad-entry-name">' + esc(r.name) + '</p><span class="ad-entry-date">' + esc(when(r.created_at)) + '</span></div>' +
              (pills ? '<p style="margin:0 0 0.75rem">' + pills + '</p>' : '') + '<dl>' +
              row('Email', '<a href="mailto:' + esc(r.email) + '">' + esc(r.email) + '</a>') +
              row('WhatsApp', r.whatsapp ? '<a href="https://wa.me/' + esc(String(r.whatsapp).replace(/[^0-9]/g, '')) + '" target="_blank" rel="noopener">' + esc(r.whatsapp) + '</a>' : '') +
              row('Group', esc(r.group_choice)) +
              row('Health', esc(r.health)) +
              row('Breathwork before', esc(r.experience)) +
              row('Heard via', esc(r.heard)) +
              row('What brings them', r.reason ? '<span class="note-body" style="display:block;margin:0">' + esc(r.reason) + '</span>' : '') +
              '</dl></article>';
          }).join('');
        } else if (tab === 'contact') {
          html = rows.map(function (r) {
            return '<article class="ad-entry"><div class="ad-entry-head"><p class="ad-entry-name">' + esc(r.name) + '</p><span class="ad-entry-date">' + esc(when(r.created_at)) + '</span></div><dl>' +
              row('Email', '<a href="mailto:' + esc(r.email) + '">' + esc(r.email) + '</a>') +
              row('Found via', esc(r.how_found)) +
              row('Email list', r.newsletter ? 'Yes' : '') +
              '</dl><p class="note-body">' + esc(r.message) + '</p></article>';
          }).join('');
        } else {
          html = '<div class="table-wrap"><table><thead><tr><th>Name</th><th>Email</th><th>Signed up</th></tr></thead><tbody>' +
            rows.map(function (r) { return '<tr><td>' + esc(r.name) + '</td><td><a href="mailto:' + esc(r.email) + '">' + esc(r.email) + '</a></td><td>' + esc(when(r.registered_at)) + '</td></tr>'; }).join('') +
            '</tbody></table></div>';
        }
        $('list').innerHTML = html;
      }

      function csv() {
        var rows = filtered();
        var cols = {
          signups: ['created_at', 'name', 'email', 'whatsapp', 'group_choice', 'waitlist', 'health', 'experience', 'heard', 'reason'],
          contact: ['created_at', 'name', 'email', 'how_found', 'newsletter', 'message'],
          freeclass: ['registered_at', 'name', 'email']
        }[tab];
        var out = '﻿' + cols.join(',') + '\n' + rows.map(function (r) {
          return cols.map(function (c) { return '"' + String(r[c] == null ? '' : r[c]).replace(/"/g, '""') + '"'; }).join(',');
        }).join('\n');
        var a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([out], { type: 'text/csv;charset=utf-8' }));
        a.download = tab + '-' + new Date().toISOString().slice(0, 10) + '.csv';
        a.click();
        URL.revokeObjectURL(a.href);
      }

      function fail(err) {
        if (err.message === 'auth') {
          pw = null;
          try { sessionStorage.removeItem(KEY); } catch (e) {}
          $('login').hidden = false; $('dash').hidden = true; $('logout').hidden = true;
          $('login-msg').textContent = 'That password didn’t work.';
        } else {
          $('dash-msg').textContent = 'Could not load the data. Try Refresh.';
          $('login-msg').textContent = 'Could not reach the server. Try again.';
        }
      }

      $('login').addEventListener('submit', function (e) {
        e.preventDefault();
        pw = $('pw').value;
        $('login-msg').textContent = 'Checking…';
        load().then(function () { $('login-msg').textContent = ''; }).catch(fail);
      });
      $('logout').addEventListener('click', function () {
        pw = null;
        try { sessionStorage.removeItem(KEY); } catch (e) {}
        location.reload();
      });
      document.querySelectorAll('.tab').forEach(function (t) {
        t.addEventListener('click', function () { tab = t.dataset.tab; render(); });
      });
      $('filter').addEventListener('change', render);
      $('refresh').addEventListener('click', function () { load().catch(fail); });
      $('csv').addEventListener('click', csv);

      if (pw) load().catch(fail);
    })();
  </script>
</body>
</html>
